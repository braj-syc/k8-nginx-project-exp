apiVersion: v1
kind: Service
metadata:
  name: grafana-nodeport
  namespace: default
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - port: 80           # Grafana container port
      targetPort: 3000   # Grafana pod listens on 3000
      nodePort: 32000    # External port to access Grafana
